<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>Catálogo de Libros</h1>
        <div class="topbar-info">
            <span id="catalogInfo" class="catalog-info">Sin conexión</span>
            <button id="configBtn" class="btn">⚙️ Configurar microservicio</button>
        </div>
    </header>

    <!-- Configuracion persistente con LocalStorage -->
    <div id="configModal" class="modal hidden">
        <div class="modal-content">
            <h2>Configuración del microservicio</h2>
            <p class="hint">
                Ubicación del microservicio y endpoint que entrega el catálogo en XML.
                Se guarda con <code>localStorage</code>, así que se recuerda al cerrar la app.
            </p>
            <label for="baseUrl">URL base del microservicio</label>
            <input type="text" id="baseUrl" class="input-text" placeholder="http://10.224.0.2:5001">
            <label for="endpointPath">Endpoint del catálogo</label>
            <input type="text" id="endpointPath" class="input-text" placeholder="/api/libros/minimo">
            <label for="pageSize">Libros por página</label>
            <input type="number" id="pageSize" class="input-text" min="1" max="100" placeholder="8">
            <div class="modal-actions">
                <button id="saveBtn" class="btn btn-primary">Guardar</button>
                <button id="cancelBtn" class="btn btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <main class="container">
        <div id="loader" class="loader hidden">Cargando catálogo...</div>
        <div id="errorBox" class="error-box hidden"></div>
        <div id="catalogGrid" class="grid"></div>
        <div class="pagination">
            <button id="prevBtn" class="btn" disabled>Anterior</button>
            <span id="pageIndicator">Página 1 de 1</span>
            <button id="nextBtn" class="btn" disabled>Siguiente</button>
        </div>
    </main>

    <script>
        // =====================================================================
        // Configuración persistente (LocalStorage)
        // =====================================================================
        const DEFAULTS = {
            baseUrl: 'http://10.224.0.2:5001',
            endpointPath: '/api/libros/minimo',
            pageSize: 8
        };
        const STORAGE_KEY = 'endpointConfig';

        // Migra la configuración antigua de una sola URL, si existe.
        function cargarConfig() {
            const guardada = localStorage.getItem(STORAGE_KEY);
            if (guardada) {
                try { return Object.assign({}, DEFAULTS, JSON.parse(guardada)); } catch (e) { /* corrupta */ }
            }
            const antigua = localStorage.getItem('xmlEndpoint');
            if (antigua) {
                const match = antigua.match(/^(https?:\/\/[^/]+)(\/.*)?$/);
                if (match) {
                    return Object.assign({}, DEFAULTS, { baseUrl: match[1], endpointPath: match[2] || '/books' });
                }
            }
            return Object.assign({}, DEFAULTS);
        }

        let config = cargarConfig();
        let currentPage = 1;

        function guardarConfig(nueva) {
            config = Object.assign({}, config, nueva);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        }

        const $ = id => document.getElementById(id);

        function abrirModal() {
            $('baseUrl').value = config.baseUrl;
            $('endpointPath').value = config.endpointPath;
            $('pageSize').value = config.pageSize;
            $('configModal').classList.remove('hidden');
        }
        $('configBtn').onclick = abrirModal;
        $('cancelBtn').onclick = () => $('configModal').classList.add('hidden');
        $('saveBtn').onclick = () => {
            const baseUrl = $('baseUrl').value.trim().replace(/\/+$/, '');
            const endpointPath = $('endpointPath').value.trim() || DEFAULTS.endpointPath;
            if (!baseUrl) { alert('Escribe la URL base del microservicio.'); return; }
            guardarConfig({ baseUrl, endpointPath, pageSize: Number($('pageSize').value) || DEFAULTS.pageSize });
            $('configModal').classList.add('hidden');
            currentPage = 1;
            cargarCatalogo();
        };

        // URL completa del microservicio + endpoint + parámetros de paginación
        function construirUrl(pagina) {
            const base = config.baseUrl.replace(/\/+$/, '');
            const ruta = config.endpointPath.startsWith('/') ? config.endpointPath : '/' + config.endpointPath;
            const separador = ruta.includes('?') ? '&' : '?';
            return `${base}${ruta}${separador}page=${pagina}&limit=${config.pageSize}`;
        }

        // Las imágenes pueden venir relativas (/uploads/x.svg): se resuelven
        // contra la URL base del microservicio configurada por el usuario.
        function resolverUrl(ruta) {
            if (!ruta) return '';
            if (/^https?:\/\//i.test(ruta)) return ruta;
            try { return new URL(ruta, config.baseUrl + '/').href; } catch (e) { return ruta; }
        }

        function texto(nodo, selector) {
            const encontrado = nodo.querySelector(selector);
            return encontrado ? (encontrado.textContent || '').trim() : '';
        }

        function leerLibro(nodo) {
            const autores = Array.from(nodo.getElementsByTagName('author'))
                .map(a => (a.textContent || '').trim())
                .filter(Boolean);
            const generos = Array.from(nodo.getElementsByTagName('genre'))
                .map(g => (g.textContent || '').trim())
                .filter(Boolean);

            // <image url="..."> (atributo) o <image>ruta</image> (texto)
            const imagenes = Array.from(nodo.getElementsByTagName('image')).map(img => ({
                url: img.getAttribute('url') || (img.textContent || '').trim(),
                isCover: (img.getAttribute('isCover') || 'false').toLowerCase() === 'true',
                alt: img.getAttribute('altText') || 'Portada del libro'
            })).filter(i => i.url);
            const portada = imagenes.find(i => i.isCover) || imagenes[0];

            const precioNodo = nodo.querySelector('price');
            return {
                isbn: nodo.getAttribute('isbn') || texto(nodo, 'isbn') || 'N/A',
                titulo: texto(nodo, 'title') || 'Sin título',
                autores: autores.length ? autores : ['Desconocido'],
                anio: texto(nodo, 'publicationYear') || texto(nodo, 'year') || 'N/A',
                precio: precioNodo ? (parseFloat(precioNodo.textContent) || 0).toFixed(2) : '0.00',
                moneda: precioNodo ? (precioNodo.getAttribute('currency') || '$') : '$',
                stock: texto(nodo, 'stock'),
                generos: generos.length ? generos : ['N/A'],
                imagen: portada ? portada.url : '',
                altImagen: portada ? portada.alt : 'Sin portada'
            };
        }

        // =====================================================================
        // Consumo del microservicio: XML y carga por petición (paginación)
        // =====================================================================
        async function cargarCatalogo() {
            const grid = $('catalogGrid');
            const loader = $('loader');
            const errorBox = $('errorBox');
            grid.innerHTML = '';
            errorBox.classList.add('hidden');
            loader.classList.remove('hidden');
            $('catalogInfo').textContent = 'Consultando…';

            try {
                const url = construirUrl(currentPage);
                const respuesta = await fetch(url);
                if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);

                const textoXml = await respuesta.text();
                const doc = new DOMParser().parseFromString(textoXml, 'text/xml');
                if (doc.getElementsByTagName('parsererror').length > 0) {
                    throw new Error('El microservicio no devolvió un XML válido.');
                }

                const raiz = doc.documentElement;
                const total = Number(raiz.getAttribute('total') || 0);
                const libros = Array.from(doc.getElementsByTagName('book')).map(leerLibro);

                render(libros);
                const totalPaginas = Math.max(1, Math.ceil(total / config.pageSize));
                $('pageIndicator').textContent = `Página ${currentPage} de ${totalPaginas}`;
                $('prevBtn').disabled = currentPage <= 1;
                $('nextBtn').disabled = currentPage >= totalPaginas || total === 0;
                $('catalogInfo').textContent = `${total} libro(s) · ${config.baseUrl}${config.endpointPath}`;
            } catch (error) {
                errorBox.textContent = `Error al consultar ${construirUrl(currentPage)}: ${error.message}`;
                errorBox.classList.remove('hidden');
                $('pageIndicator').textContent = 'Página 1 de 1';
                $('prevBtn').disabled = true;
                $('nextBtn').disabled = true;
                $('catalogInfo').textContent = 'Sin conexión';
            } finally {
                loader.classList.add('hidden');
            }
        }

        function render(libros) {
            const grid = $('catalogGrid');
            grid.innerHTML = '';
            if (!libros.length) {
                grid.innerHTML = '<p class="vacio">El microservicio no devolvió libros.</p>';
                return;
            }
            libros.forEach(libro => {
                const card = document.createElement('article');
                card.className = 'card';
                const imagen = libro.imagen
                    ? `<img src="${libro.imagen}" alt="${libro.altImagen}" class="card-img"
                              onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22><rect width=%22300%22 height=%22450%22 fill=%22%23e5e7eb%22/><text x=%22150%22 y=%22230%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22%236b7280%22>Sin portada</text></svg>'">`
                    : '<div class="card-img card-img-vacia">Sin portada</div>';
                const stock = libro.stock === '' ? '' :
                    (Number(libro.stock) > 0
                        ? `<span class="stock stock-ok">Stock: ${libro.stock}</span>`
                        : '<span class="stock stock-out">Agotado</span>');
                card.innerHTML = `
                    <div class="card-img-container">${imagen}</div>
                    <div class="card-body">
                        <h2 class="card-title">${libro.titulo}</h2>
                        <p class="card-author">${libro.autores.join(', ')}</p>
                        <dl class="card-meta">
                            <div><dt>ISBN</dt><dd>${libro.isbn}</dd></div>
                            <div><dt>Año</dt><dd>${libro.anio}</dd></div>
                            <div><dt>Género</dt><dd>${libro.generos.join(', ')}</dd></div>
                        </dl>
                        <div class="card-footer">
                            <span class="price">${libro.moneda}${libro.precio}</span>
                            ${stock}
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        $('prevBtn').onclick = () => { if (currentPage > 1) { currentPage--; cargarCatalogo(); } };
        $('nextBtn').onclick = () => { currentPage++; cargarCatalogo(); };

        cargarCatalogo();
    </script>
</body>
</html>
